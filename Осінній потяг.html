<script>
(()=>{
/* ---------- renderer ---------- */

const scene=new THREE.Scene();

const SNAP=new THREE.Vector2(160,90);

/* ---------- chunks: 40 m slices of the world that slide past ---------- */
const outside=new THREE.Group();scene.add(outside);const CL=40,world=new THREE.Group();outside.add(world);const chunks=[];
const GROUNDV=L({map:tGround,vertexColors:true});
const DENS={forest:1,birch:1,cityforest:.6,lake:.35,village:.3,field:.12,city:.15,industrial:.15,depot:.1};
function blendTrees(g,c,pb,biome){const a=DENS[pb]||0,b=DENS[biome]||0;
    if(a>b+.15&&biome!=='lake'){const boxes=[];g.updateMatrixWorld(true);for(const ch of g.children){if(ch.userData.keep||ch.userData.ground)continue;BX.setFromObject(ch);if(isFinite(BX.min.x))boxes.push(BX.clone().expandByScalar(1.5))}
    const MIXP={forest:{con:.2,bir:.1},birch:{con:.08,bir:.6},cityforest:{con:.18,bir:.15},lake:{con:.3,bir:.15},village:{con:.06,bir:.25}}[pb]||{con:.1,bir:.2},n=Math.round((a-b)*70),v=new THREE.Vector3();
    for(let i=0;i<n;i++){const x=rr(0,26),z=rr(-13,-120);if(rnd()>Math.pow(1-x/26,1.3))continue;if(g.userData.road&&z>-34&&z<-22)continue;v.set(x+g.position.x,1,z);if(boxes.some(bb=>bb.containsPoint(v)))continue;tree(c,x,z,rr(7,14),MIXP)}}}
const BIOMES={forest:.22,birch:.09,field:.17,lake:.12,city:.12,cityforest:.14,industrial:.08,village:.15,depot:.08};let noLakeUntil=-1e9,lastLakeAbs=-1e9;
function pickBiome(not){let r=rnd()*0.999,b='forest';const k=Object.keys(BIOMES).filter(x=>x!==not&&!(x==='lake'&&odo+420<noLakeUntil)),tot=k.reduce((a,x)=>a+BIOMES[x],0);r*=tot;for(const x of k){r-=BIOMES[x];if(r<=0){b=x;break}}return b}
const TRACK_LAMP=B({color:0x3a3a36}),POOL=new THREE.MeshBasicMaterial({color:0xffc070,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}),POOL_GEO=new THREE.CircleGeometry(3.2,10).rotateX(-Math.PI/2);
/* ---------- stations ---------- */

// kilometre stations show the real distance travelled: a random starting kilometre plus the station's place along the line
const KM0=rr(12,140)|0;

function signTex(name,white){return ctex(256,48,g=>{g.fillStyle=white?'#e4e0d4':'#24427a';g.fillRect(0,0,256,48);g.strokeStyle=white?'#1a1a1a':'#e8e8e0';g.lineWidth=3;g.strokeRect(3,3,250,42);g.fillStyle=white?'#1a1a1a':'#f0f0e8';let fs=34;do{g.font=`bold ${fs}px Arial, sans-serif`;fs-=2}while(g.measureText(name).width>226&&fs>14);g.textAlign='center';g.textBaseline='middle';g.fillText(name,128,26)},false)}
const PLAT=L({color:0x8a8884}),EDGE=B({color:0xd8d4c0}),BRICK=L({color:0x8a4a3a}),skinM=L({color:0x8c7a6a}),legM=L({color:0x202224}),hatM=L({color:0x2a2622});
