<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Осінній потяг</title>
<style>
/* Layout: one full-bleed low-res canvas — the view from a compartment window. No text anywhere. */
:root{--bg:#5c6463;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 22vmin rgba(0,0,0,.55)}
</style>
<canvas id="c" aria-label="Вид з вікна потяга, що їде крізь осінь"></canvas>
<div class="scan"></div><div class="vig"></div><div id="toast" style="position:fixed;left:16px;top:16px;font:600 13px/1.4 system-ui,sans-serif;color:#e8e4d8;background:rgba(20,22,24,.72);padding:6px 10px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .4s"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
/* ---------- renderer ---------- */
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false});renderer.setPixelRatio(1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,16/9,.1,800);
const SNAP=new THREE.Vector2(160,90);
function resize(){const a=innerWidth/Math.max(1,innerHeight),rh=a<1?400:300;renderer.setSize(Math.round(rh*a),rh,false);camera.aspect=a;camera.fov=a<1?80:58;camera.updateProjectionMatrix();SNAP.set(Math.round(rh*a)/1.2,rh/1.2)}
addEventListener('resize',resize);resize();

/* ---------- PS1 look: snapped vertices, affine textures, dithered colour ---------- */
function psx(m){m.onBeforeCompile=s=>{s.uniforms.uSnap={value:SNAP};
  s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform vec2 uSnap;\nvarying vec3 vAff;')
    .replace('#include <project_vertex>','#include <project_vertex>\ngl_Position.xy=floor(gl_Position.xy/gl_Position.w*uSnap+0.5)/uSnap*gl_Position.w;\n#ifdef USE_UV\nvAff=vec3(vUv*gl_Position.w,gl_Position.w);\n#else\nvAff=vec3(0.0,0.0,1.0);\n#endif');
  s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vAff;')
    .replace('#include <map_fragment>','#ifdef USE_MAP\nvec4 texelColor=texture2D(map,vAff.xy/vAff.z);\ntexelColor=mapTexelToLinear(texelColor);\ndiffuseColor*=texelColor;\n#endif')
    .replace('#include <dithering_fragment>','{const float BY[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);ivec2 q=ivec2(mod(gl_FragCoord.xy,4.0));gl_FragColor.rgb=floor(gl_FragColor.rgb*44.0+BY[q.x+q.y*4]/16.0)/44.0;}');
};return m}
function psxSoft(m){m.onBeforeCompile=s=>{s.fragmentShader=s.fragmentShader.replace('#include <dithering_fragment>','{const float BY[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);ivec2 q=ivec2(mod(gl_FragCoord.xy,4.0));gl_FragColor.rgb=floor(gl_FragColor.rgb*44.0+BY[q.x+q.y*4]/16.0)/44.0;}')};m.customProgramCacheKey=()=>'soft';return m}
const GL=o=>psxSoft(new THREE.MeshLambertMaterial(o));
const L=o=>psx(new THREE.MeshLambertMaterial(o)),B=o=>psx(new THREE.MeshBasicMaterial(o));
const rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a),pick=a=>a[rnd()*a.length|0],chance=p=>rnd()<p;
function ctex(w,h,draw,rep=true){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;t.canvas=c;return t}
function speck(g,w,h,n,cols,a=.4){for(let i=0;i<n;i++){g.globalAlpha=a*rnd();g.fillStyle=pick(cols);g.fillRect(rnd()*w|0,rnd()*h|0,1+(rnd()*2|0),1+(rnd()*2|0))}g.globalAlpha=1}

/* ---------- textures ---------- */
const tGround=ctex(32,32,g=>{g.fillStyle='#808080';g.fillRect(0,0,32,32);speck(g,32,32,260,['#6a6a6a','#9a9a9a','#5a5a5a'],.6)});tGround.repeat.set(10,104);tGround.minFilter=THREE.NearestMipmapLinearFilter;tGround.generateMipmaps=true;tGround.needsUpdate=true;
const tGravel=(t=>{t.minFilter=THREE.LinearMipmapLinearFilter;t.generateMipmaps=true;t.anisotropy=4;return t})(ctex(32,32,g=>{g.fillStyle='#6e6862';g.fillRect(0,0,32,32);speck(g,32,32,300,['#5a544e','#8a847c','#4a443e'],.7);g.fillStyle='#3e2e22';for(let x=0;x<32;x+=8)g.fillRect(x,0,4,32)}));
const tWater=ctex(32,32,g=>{g.fillStyle='#8a9498';g.fillRect(0,0,32,32);g.fillStyle='#a8b2b6';for(let i=0;i<40;i++)g.fillRect(rnd()*32|0,rnd()*32|0,3+(rnd()*5|0),1)});tWater.repeat.set(4,18);
const tBark=ctex(8,16,g=>{g.fillStyle='#3a2e26';g.fillRect(0,0,8,16);speck(g,8,16,20,['#2a201a','#4a3e34'])});
const tBirch=ctex(8,16,g=>{g.fillStyle='#d8d4c8';g.fillRect(0,0,8,16);g.fillStyle='#2a2622';for(let i=0;i<7;i++)g.fillRect(rnd()*8|0,rnd()*16|0,2+(rnd()*3|0),1)});
const tWall=ctex(32,32,g=>{g.fillStyle='#2e302e';g.fillRect(0,0,32,32);speck(g,32,32,120,['#262826','#363a36'],.5)});
const tWood=ctex(16,16,g=>{g.fillStyle='#5a3a24';g.fillRect(0,0,16,16);g.fillStyle='#4a2e1a';for(let y=0;y<16;y+=3)g.fillRect(0,y,16,1)});
const tCurtain=ctex(16,32,g=>{g.fillStyle='#b8a888';g.fillRect(0,0,16,32);g.fillStyle='#8a5a3a';for(let x=0;x<16;x+=5)g.fillRect(x,0,1,32);g.fillStyle='#9a7a5a';for(let y=4;y<32;y+=8)g.fillRect(0,y,16,1);speck(g,16,32,30,['#a89878'])});
const tStripe=ctex(8,32,g=>{for(let y=0;y<32;y+=8){g.fillStyle='#a8483a';g.fillRect(0,y,8,4);g.fillStyle='#d8d0c4';g.fillRect(0,y+4,8,4)}});
function facadeTex(base,litP){const N=16,S=N*32,lit=[],LC=['#e0b468','#e8c27a','#d8a050','#c89a68','#f0d090','#a8b4c0'];
  const rowF=[...Array(N)].map(()=>rnd()<.15?.2:rr(.5,1.5)),colF=[...Array(N)].map(()=>rnd()<.1?2.4:rr(.5,1.4));
  const t=ctex(S,S,g=>{g.fillStyle=base;g.fillRect(0,0,S,S);speck(g,S,S,9000,['#00000022','#ffffff18','#55504a']);g.fillStyle='rgba(0,0,0,.18)';for(let i=0;i<S;i+=32){g.fillRect(i,0,1,S);g.fillRect(0,i,S,1)}
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=c*32+9,y=r*32+8,p=litP*rowF[r]*colF[c],on=rnd()<p&&!(c>0&&lit[lit.length-1]&&rnd()<.3);const col=on?pick(LC):null;lit.push(col);
      g.fillStyle=col||(rnd()<.2?'#2a2a26':'#22272e');g.fillRect(x,y,15,17);if(on&&rnd()<.35){g.fillStyle='rgba(120,60,30,.45)';g.fillRect(x,y,rnd()<.5?5:15,17)}g.fillStyle='#c4c0b4';g.fillRect(x,y+6,15,1);g.fillRect(x+7,y,1,17);g.strokeStyle='#c4c0b4';g.strokeRect(x+.5,y+.5,14,16)}});
  const e=ctex(S,S,g=>{g.fillStyle='#000';g.fillRect(0,0,S,S);let k=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const col=lit[k++];if(col){g.globalAlpha=rr(.45,1);g.fillStyle=col;g.fillRect(c*32+9,r*32+8,15,17)}}g.globalAlpha=1});return[t,e]}

/* ---------- materials ---------- */
const FAC=[['#8a877f',.25],['#9a9282',.2],['#7a7c7e',.3],['#a09a8c',.18],['#b4a474',.22],['#8696a4',.22],['#a8887a',.2],['#94a28c',.2],['#bcb8ac',.25],['#8a5c4a',.2],['#c0a890',.2]].map(([b,p])=>{const[t,e]=facadeTex(b,p);return L({map:t,emissiveMap:e,emissive:0xffffff,emissiveIntensity:.4})});
const MAT={
  ground:{forest:GL({map:tGround,color:0x6a5236}),birch:GL({map:tGround,color:0x7a6638}),field:GL({map:tGround,color:0x8a8248}),lake:GL({map:tGround,color:0x6a6a4a}),city:GL({map:tGround,color:0x6e6c66}),cityforest:GL({map:tGround,color:0x6a5636}),industrial:GL({map:tGround,color:0x5c5a54}),depot:GL({map:tGround,color:0x605a4e}),village:GL({map:tGround,color:0x72703e}),pgt:GL({map:tGround,color:0x6a6a52})},
  water:L({map:tWater,color:0x46525a,emissive:0x0c1216}),gravel:new THREE.MeshLambertMaterial({map:tGravel}),bark:L({map:tBark}),birch:L({map:tBirch}),leaf:L({color:0xffffff}),
  metal:L({color:0x4a4e50}),rail:L({color:0x6a6460}),dark:L({color:0x24282a}),wood:L({map:tWood}),roof:L({color:0x5a3028}),hay:L({color:0x9a8448}),reed:L({color:0x8a7a44}),
  lamp:B({color:0xffc070}),stripe:L({map:tStripe}),garage:L({color:0x5a4a3c}),wall:L({map:tWall}),curtain:L({map:tCurtain,side:THREE.DoubleSide}),
  cup:L({color:0x9a9890}),tea:L({color:0x8a4a18,emissive:0x2a1004}),train:L({color:0x3f6a4a}),trainStripe:L({color:0x8a2a20}),trainWin:B({color:0xd8c890})
};
const PAL=['#c8742a','#d6a83a','#9a3a22','#b0562a','#7a7a3a','#d9b84a','#8a5a2a','#c0622a'],CON=['#24342a','#2c3a2c','#30402e'],BIRCHC=['#d8b440','#e0c050','#c89a30'];

/* ---------- geometry helpers ---------- */
const GEO={trunk:new THREE.BoxGeometry(.3,1,.3).translate(0,.5,0),blob:new THREE.IcosahedronGeometry(1,0),cone:new THREE.ConeGeometry(1,1,6).translate(0,.5,0),box:new THREE.BoxGeometry(1,1,1).translate(0,.5,0),
  ground:new THREE.PlaneGeometry(40,520,2,10).rotateX(-Math.PI/2).translate(20,0,-266),hay:new THREE.CylinderGeometry(1.3,1.5,1.5,7).translate(0,.75,0),hayTop:new THREE.ConeGeometry(1.4,1.1,7).translate(0,2.0,0),
  cbox:new THREE.BoxGeometry(1,1,1),roof:new THREE.ConeGeometry(1,1,4).rotateY(Math.PI/4).translate(0,.5,0),chimney:new THREE.CylinderGeometry(1,1.4,1,8).translate(0,.5,0)};
const M4=new THREE.Matrix4(),V=new THREE.Vector3(),Q=new THREE.Quaternion(),E=new THREE.Euler(),S=new THREE.Vector3(),CC=new THREE.Color();
function inst(geo,mat,list,colored){if(!list.length)return null;const m=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((t,i)=>{M4.compose(V.set(t[0],t[1],t[2]),Q.setFromEuler(E.set(t[6]||0,t[7]||0,t[8]||0)),S.set(t[3],t[4],t[5]));m.setMatrixAt(i,M4);if(colored){CC.set(t[9]).offsetHSL(rr(-.015,.015),0,rr(-.06,.04));m.setColorAt(i,CC)}});
  m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;m.frustumCulled=false;return m}
function fitUV(g,w,h,d){const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv,cx=w/Math.max(1,Math.round(w/3))*16,cy=h/Math.max(1,Math.round(h/2.8))*16,cz=d/Math.max(1,Math.round(d/3))*16;
  for(let i=0;i<p.count;i++){const x=p.getX(i)+w/2,y=p.getY(i)+h/2,z=p.getZ(i)+d/2,ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));
    if(ax>=ay&&ax>=az)uv.setXY(i,(n.getX(i)>0?d-z:z)/cz,y/cy);else if(ay>=az)uv.setXY(i,x/cx,z/cz);else uv.setXY(i,(n.getZ(i)>0?x:w-x)/cx,y/cy)}uv.needsUpdate=true}
function addBox(g,mat,x,y,z,w,h,d){const m=new THREE.Mesh(GEO.box,mat);m.position.set(x,y,z);m.scale.set(w,h,d);g.add(m);return m}

/* ---------- landscape pieces ---------- */
let bareP=.01;const isBare=()=>rnd()<bareP;
function bareTop(arr,x,z,h,w){for(let k=0;k<4+(rnd()*3|0);k++){const a=rr(0,6.3),t=rr(.35,.75);arr.push([x,h*rr(.4,.6),z,w,h*rr(.3,.45),w,Math.sin(a)*t,0,Math.cos(a)*t])}}
function decid(c,x,z,h){c.tr.push([x,0,z,1+h*.03,h*.55,1+h*.03]);if(isBare()){bareTop(c.tr,x,z,h,.35);return}const col=pick(PAL),n=1+(rnd()*3|0);
  for(let k=0;k<n;k++){const r=h*rr(.2,.3);c.bl.push([x+rr(-.8,.8),h*.55+rr(0,h*.22),z+rr(-.8,.8),r,r*rr(1,1.35),r,0,rr(0,6),0,k&&chance(.4)?pick(PAL):col])}}
function conifer(c,x,z,h){c.tr.push([x,0,z,.8,h*.3,.8]);c.co.push([x,h*.12,z,h*.2,h*.92,h*.2,0,rr(0,6),0,pick(CON)])}
function birchT(c,x,z,h){c.bt.push([x,0,z,.55,h*.72,.55]);if(isBare()){bareTop(c.bt,x,z,h,.22);return}c.bl.push([x,h*.62,z,h*.16,h*.3,h*.16,0,rr(0,6),0,pick(BIRCHC)]);if(chance(.5))c.bl.push([x+rr(-.5,.5),h*.75,z+rr(-.5,.5),h*.12,h*.2,h*.12,0,0,0,pick(BIRCHC)])}
let treeGate=null;function tree(c,x,z,h,mix){if(treeGate&&!treeGate(x,z))return;const r=rnd();if(r<mix.con)conifer(c,x,z,h);else if(r<mix.con+mix.bir)birchT(c,x,z,h);else decid(c,x,z,h)}
function treeline(c,zA,zB,n,mix){for(let i=0;i<n*2;i++)sprite(c,rr(0,40),rr(zA,zB),rr(7,14),mix)}
function sprite(c,x,z,h,mix){if(treeGate&&!treeGate(x,z))return;const r=rnd();(c.sp||(c.sp=[])).push(r<mix.con?[x,0,z,h*1.05,pick(CON),1]:r<mix.con+mix.bir?[x,0,z,h,pick(BIRCHC),2]:[x,0,z,h,pick(PAL),0])}
const SPRT=[g=>{g.fillStyle='#3a3330';g.fillRect(15,18,3,14);for(const[x,y,r,c]of[[16,12,9,'#d8d8d8'],[10,15,6,'#c8c8c8'],[22,14,7,'#e8e8e8'],[16,7,6,'#ffffff'],[19,17,5,'#b8b8b8'],[12,9,5,'#f0f0f0']]){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}},
  g=>{g.fillStyle='#2a2420';g.fillRect(15,26,2,6);for(let k=0;k<4;k++){const y0=4+k*6,w=4+k*3.2;g.fillStyle=k%2?'#c8c8c8':'#ffffff';g.beginPath();g.moveTo(16,y0-2);g.lineTo(16+w,y0+8);g.lineTo(16-w,y0+8);g.fill()}},
  g=>{g.fillStyle='#e0e0d8';g.fillRect(15,12,2,20);g.fillStyle='#303030';for(let y=14;y<30;y+=4)g.fillRect(15,y,2,1);for(const[x,y,r]of[[16,9,6],[13,13,4],[19,12,4],[16,4,3]]){g.fillStyle='#f4f4f4';g.beginPath();g.ellipse(x,y,r*.75,r,0,0,7);g.fill()}}
].map(f=>ctex(32,32,g=>{g.clearRect(0,0,32,32);f(g)},false));
const SPRM=SPRT.map(t=>{const m=new THREE.PointsMaterial({map:t,size:1/Math.tan(26*Math.PI/180),sizeAttenuation:true,alphaTest:.5,vertexColors:true});m.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('uniform float size;','uniform float size;\nattribute float aSize;').replace('gl_PointSize = size;','gl_PointSize = size * aSize;')};return m});
function spritePoints(list,type){const L2=list.filter(t=>t[5]===type);if(!L2.length)return null;const pos=[],col=[],sz=[],C=new THREE.Color();for(const t of L2){const f=rr(1,1.5);pos.push(t[0],t[1]+t[3]*.25*f,t[2]);C.set(t[4]).offsetHSL(rr(-.02,.02),0,rr(-.06,.04));col.push(C.r,C.g,C.b);sz.push(t[3]*.5*f)}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));geo.setAttribute('aSize',new THREE.Float32BufferAttribute(sz,1));return new THREE.Points(geo,SPRM[type])}
function building(g,x,z,w,h,d){const geo=new THREE.BoxGeometry(w,h,d,Math.ceil(w/8),Math.ceil(h/8),1);fitUV(geo,w,h,d);{const uv=geo.attributes.uv,ou=(rnd()*16|0)/16,ov=(rnd()*16|0)/16;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)+ou,uv.getY(i)+ov)}const m=new THREE.Mesh(geo,pick(FAC));m.position.set(x,h/2,z);g.add(m);if(chance(.6))addBox(g,MAT.dark,x,h,z,w+.4,.5,d+.4)}
function dacha(g,x,z){const w=rr(3.5,5),d=rr(3,4),h=rr(2.4,3);addBox(g,chance(.5)?MAT.wood:MAT.garage,x,0,z,w,h,d);const r=new THREE.Mesh(GEO.roof,MAT.roof);r.position.set(x,h,z);r.scale.set(w*.75,rr(1.4,2.2),d*.75);g.add(r)}
const SIGNS=[0x9a2a22,0x2a6a3a,0x2a4a8a,0xb08a2a,0x6a2a6a].map(c=>B({color:c}));
function shop(g,x,z,w,d){const h=rr(3.4,4.2);addBox(g,pick(WALLS),x,0,z,w,h,d);addBox(g,MAT.dark,x,h,z,w+.3,.3,d+.3);addBox(g,WINV,x-.9,.6,z+d/2+.02,w-3.4,1.9,.05);addBox(g,pick(SIGNS),x,h-.85,z+d/2+.05,w*.7,.55,.06);addBox(g,MAT.dark,x+w/2-1.2,0,z+d/2+.06,1,2.1,.04);if(chance(.5))addBox(g,MAT.roof,x,2.6,z+d/2+.6,w-1,.08,1.3)}
function kiosk(g,x,z){addBox(g,pick([BLUEM,YELM,WALLS[2]]),x,0,z,2.4,2.5,2);addBox(g,WINV,x,1,z+1.02,1.8,.9,.04);addBox(g,MAT.dark,x,2.5,z,2.7,.12,2.3)}
const CITYT={site:{w:[16,24],d:[12,14]},shop:{w:[8,15],d:[9,12]},kiosk:{w:[3,3],d:[3,3]},khr:{w:[20,30],d:[11,12],h:[14,14]},school:{w:[28,36],d:[14,16],h:[10.5,11]},panel:{w:[24,36],d:[12,13],h:[27,27]},tower:{w:[14,18],d:[14,16],h:[36,48]}};
const UNF=(()=>{const N=16,C=16,S=N*C;const t=ctex(S,S,g=>{g.fillStyle='#8a867c';g.fillRect(0,0,S,S);for(let i=0;i<N;i++)for(let j=0;j<N;j++){g.fillStyle=(i+j)%3?'#86827a':'#8e8a80';g.fillRect(i*C,j*C,C,C);g.fillStyle='#0c0c0c';g.fillRect(i*C+4,j*C+4,C-8,C-7)}});return L({map:t})})();
function unfinished(g0,x,z,w,d){const G=new THREE.Group();g0.add(G);const n=4+(rnd()*6|0),fh=2.8,done=Math.floor(n*rr(.3,.7)),fac=UNF;
  for(let k=0;k<=n;k++)addBox(G,CONC,x,k*fh,z,w,.28,d);
